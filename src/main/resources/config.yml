prefix: ""

despawn-time-seconds: 1800
drop-items: true
dropped-item-velocity: true
enable-instant-pickup: true
instant-pickup-only-own: false
override-keep-inventory: false
hologram-height: 0.5
head-height: -1.2
rotate-head-360: true

auto-rotation:
  enabled: false
  speed: 10.0

interact-only-own: false
interact-radius: 7.0
interaction-hitbox:
  width: 1.6
  height: 2.2

protection:
  seconds: 30
  message-cooldown-seconds: 3

safe-placement:
  enabled: true
  avoid-lava: true
  avoid-solid: true
  avoid-nether-roof: true
  nether-roof-y: 125
  require-ground-support: true
  max-horizontal-radius: 16
  max-vertical-distance: 128
  notify-owner: true

xp-keep-percentage: 1.0
store-items: true
store-xp: true

grave-item-order:
  - "ARMOR"
  - "HAND"
  - "OFFHAND"

auto-equip-armor: true
grave-limit: -1

save-graves:
  enabled: true
  auto-save-seconds: 30

storage:
  type: H2
  table-prefix: "axgraves_"
  mysql:
    address: 127.0.0.1
    port: 3306
    database: axgraves
    username: root
    password: ""
    pool:
      maximum-pool-size: 10
      minimum-idle: 10
  flush-interval-seconds: 15

history:
  enabled: true
  keep-per-player: 5
  keep-days: 14

teleport:
  cooldown-seconds: 60
  warmup-seconds: 5
  cancel-on-move: true
  cancel-on-damage: true
  cost: 0
  currency-symbol: "₱"
  confirmation-timeout-seconds: 15

custom-grave-skull:
  enabled: false
  base64: ""

spawn-height-limits:
  world:
    min: -64
    max: 319
  world_nether:
    min: 0
    max: 319
  world_the_end:
    min: 0
    max: 319

command-aliases:
  - "clovergraves"
  - "clovergrave"
  - "graves"
  - "grave"
  - "axgraves"
  - "axgrave"
  - "bibingka"

world-name:
  world: "Обычный мир"
  world_nether: "Незер"
  world_the_end: "Энд"

disabled-worlds:
  - "blacklisted_world"

blacklisted-death-causes:
  - "EXAMPLE_DEATH_CAUSE"

blacklisted-items:
  "1":
    material: "barrier"
    name-contains: "Banned item's name"

death-listener-priority: HIGHEST

holograms:
  background-color: "00000000"
  alignment: center
  billboard: vertical
  see-through: false
  shadow: true

update-notifier:
  enabled: true
  on-join: true

debug: false

version: 25
