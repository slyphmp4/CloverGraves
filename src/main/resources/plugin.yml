name: AxGraves
version: '${project.version}'
main: com.artillexstudios.axgraves.AxGraves
api-version: '1.20'
folia-supported: true

permissions:
  axgraves.help:
    default: true
  axgraves.reload:
    default: op
  axgraves.list:
    default: true
  axgraves.list.other:
    default: op
  # teleporting to your *own* grave is a normal player feature (that's the whole point of the
  # cooldown/warmup on it) - tp.bypass (arbitrary coordinates, any player's grave) stays op-only
  axgraves.tp:
    default: true
  axgraves.tp.bypass:
    default: op
  axgraves.allowgraves:
    default: true
  axgraves.limit.1:
    default: false
  # already referenced in code prior to this release (grave admin bypass, update-notify
  # broadcast) but was never declared here - permission-plugin default-grant logic for
  # them was silently broken until now.
  axgraves.admin:
    default: op
  axgraves.update-notify:
    default: op
  axgraves.protection.bypass:
    default: op
  axgraves.history:
    default: op
  axgraves.restore:
    default: op