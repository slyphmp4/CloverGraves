hologram:
  - "&FF0000☠ &FF0000&l%player% &FF0000☠"
  - "&00CC00⌛ &00FF00%despawn-time% &00CC00⌛"
  - "&00AAFF%item% &fɪᴛᴇᴍ &8| &00AAFF%xp% &fxᴘ"

help:
  - "&7"
  - "<gradient:#FF00FF:#DD00FF><b>CloverGraves</b></gradient> <#FF55FF>Help"
  - " <#FF55FF>➤ <white>/clovergraves reload <#DDDDDD>| <#FFAAFF>Reload plugin"
  - " <#FF55FF>➤ <white>/clovergraves list <#DDDDDD>| <#FFAAFF>List spawned graves"
  - " <#FF55FF>➤ <white>/clovergraves tp <#DDDDDD>| <#FFAAFF>Teleport to last grave"
  - " <#FF55FF>➤ <white>/clovergraves history <player> <#DDDDDD>| <#FFAAFF>View a player's grave history"
  - " <#FF55FF>➤ <white>/clovergraves restore <player> <id> <#DDDDDD>| <#FFAAFF>Restore a past grave"
  - "&7"

gui-name: "&0%player%'s Grave"
unknown-player: "Unknown"

reload:
  success:
    - "&7"
    - "&33FF33Plugin successfully reloaded!"
    - "&7"
  failed:
    - "&7"
    - "&FF3333Failed to reload the plugin! Check the &f%file%&FF3333 file."
    - "&7"

interact:
  not-your-grave:
    - "&7"
    - "&FFAAFFYou can only open your own grave!"
    - "&7"
  protected:
    - "&7"
    - "&FFAAFFThis grave is still protected for &f%time%&FFAAFF!"
    - "&7"

death-message:
  enabled: false
  message:
    - "&7"
    - "&FFAAAAYou have died at &f%world% %x%, %y%, %z%&FFAAAA!"
    - "&7"

grave-relocated:
  - "&7"
  - "&FFAAAAYour grave was moved to &f%world% %x%, %y%, %z%&FFAAAA."
  - "&7"

grave-relocated-far:
  - "&7"
  - "&FFAAAANo safe ground was found nearby. Your grave was moved near spawn: &f%world% %x%, %y%, %z%&FFAAAA."
  - "&7"

teleport:
  cooldown:
    - "&7"
    - "&FFAAFFYou must wait &f%time%&FFAAFF before teleporting again."
    - "&7"
  already-pending:
    - "&7"
    - "&FFAAFFYou already have a teleport in progress."
    - "&7"
  warmup-start:
    - "&7"
    - "&FFAAFFTeleporting in &f%seconds%s&FFAAFF. Don't move."
    - "&7"
  countdown:
    - "&FFAAFF%seconds%..."
  warmup-complete:
    - "&33FF33Teleporting now!"
  cancelled:
    - "&7"
    - "&FF3333Teleport cancelled."
    - "&7"
  cost-confirm:
    - "&7"
    - "&FFAAFFTeleport costs &f%cost%&FFAAFF. Run the command again within &f%seconds%s&FFAAFF to confirm."
    - "&7"
  cost-insufficient:
    - "&7"
    - "&FF3333You need &f%cost%&FF3333, but you only have &f%balance%&FF3333."
    - "&7"
  cost-charged:
    - "&7"
    - "&FFAAFFCharged &f%cost%&FFAAFF for the teleport."
    - "&7"

history:
  header:
    - "&7"
    - "&FF00FF&l=== GRAVE HISTORY: %player% ==="
  entry:
    - "&FF00FF[#%id%] &FFAAFF%world% %x%, %y%, %z% &7- %items% items, %xp% xp &7(%reason%, %time% ago)"
  entry-restored:
    - "&FF00FF[#%id%] &FFAAFF%world% %x%, %y%, %z% &7- %items% items, %xp% xp &7(%reason%, %time% ago, already restored)"
  empty:
    - "&7"
    - "&FFAAFFNo grave history found for &f%player%&FFAAFF."
    - "&7"

restore:
  success:
    - "&7"
    - "&33FF33Restored grave &f#%id%&33FF33 belonging to &f%player%&33FF33 at &f%world% %x%, %y%, %z%&33FF33."
    - "&7"
  not-found:
    - "&7"
    - "&FF3333No grave &f#%id%&FF3333 found for &f%player%&FF3333."
    - "&7"
  already-restored:
    - "&7"
    - "&FF3333Grave &f#%id%&FF3333 has already been restored."
    - "&7"
  failed:
    - "&7"
    - "&FF3333Failed to restore grave &f#%id%&FF3333. See console for details."
    - "&7"
  unsupported:
    - "&7"
    - "&FF3333Grave history and restore require H2, SQLite or MySQL storage."
    - "&7"

grave-list:
  header:
    - "&7"
    - "&FF00FF&l=== GRAVES ==="
  grave:
    - "&FF00FF[TP] &FFAAFF%player% &7- &FFAAFF%world% %x%, %y%, %z% &7(%time%)"
  no-graves:
    - "&7"
    - "&FFAAFFNo graves found!"
    - "&7"

commands:
  invalid-value:
    - "&7"
    - "&FF0000Invalid parameter: &BB0000%value%"
    - "&7"
  invalid-command:
    - "&7"
    - "&FF0000Invalid command or subcommand."
    - "&7"
  missing-argument:
    - "&7"
    - "&FF0000Missing argument: &BB0000%value%&FF0000."
    - "&7"
  no-permission:
    - "&7"
    - "&FF0000You don't have permission to use this command."
    - "&7"
  out-of-range:
    - "&7"
    - "&FF0000The &BB0000%number% &FF0000must be between &BB0000%min% &FF0000and &BB0000%max%&FF0000."
    - "&7"
  player-only:
    - "&7"
    - "&FF0000You must be a player to use this command."
    - "&7"
  invalid-player:
    - "&7"
    - "&FF0000The player &BB0000%player% &FF0000could not be found."
    - "&7"
  invalid-selector:
    - "&7"
    - "&FF0000Selectors are not supported by this command."
    - "&7"

update-notifier:
  - "&7"
  - "&FF88FFThere is a new CloverGraves version available. &DDDDDD(&FFFFFFcurrent: &FF0000%current% &DDDDDD| &FFFFFFlatest: &00FF00%latest%&DDDDDD)"
  - "&7"

version: 10
