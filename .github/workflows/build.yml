name: Build CloverGraves

on:
  push:
    branches: [rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Audit Cardboard compatibility
        shell: bash
        run: |
          echo "=== AxAPI imports ==="
          grep -RIn "com.artillexstudios.axapi" src/main/java || true
          echo "=== Config API usage ==="
          grep -RhoE '(CONFIG|LANG)\.[A-Za-z0-9_]+' src/main/java | sort -u || true
          echo "=== StringUtils API usage ==="
          grep -RhoE 'StringUtils\.[A-Za-z0-9_]+' src/main/java | sort -u || true
          echo "=== Scheduler API usage ==="
          grep -RhoE 'Scheduler\.[A-Za-z0-9_]+|Scheduler\.get\(\)\.[A-Za-z0-9_]+' src/main/java | sort -u || true

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload CloverGraves jar
        uses: actions/upload-artifact@v4
        with:
          name: CloverGraves-${{ github.sha }}
          path: |
            build/libs/CloverGraves-*.jar
            !build/libs/*-unshaded.jar
          if-no-files-found: error
