name: Build CloverGraves

on:
  push:
    branches: [rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Audit AxAPI runtime imports
        run: grep -RIn "com.artillexstudios.axapi" src/main/java || true

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload CloverGraves jar
        uses: actions/upload-artifact@v4
        with:
          name: CloverGraves-${{ github.sha }}
          path: |
            build/libs/CloverGraves-*.jar
            !build/libs/*-unshaded.jar
          if-no-files-found: error
