name: Build CloverGraves

on:
  push:
    branches: [rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Audit Cardboard compatibility
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'com\.artillexstudios\.axapi|org\.bukkit\.craftbukkit|net\.minecraft' src/main/java; then
            echo 'Forbidden AxAPI/NMS/CraftBukkit dependency found in main source.'
            exit 1
          fi
          if grep -RInE 'ArmorStandGraveHologram|GraveHologramFactory' src/main/java; then
            echo 'Legacy hologram fallback code is still present.'
            exit 1
          fi

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Audit built jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'CloverGraves-*.jar' ! -name '*-unshaded.jar' | head -n 1)"
          test -n "$JAR"
          if jar tf "$JAR" | grep -E 'com/artillexstudios/axapi|org/bukkit/craftbukkit|net/minecraft'; then
            echo 'Forbidden AxAPI/NMS/CraftBukkit classes found in release jar.'
            exit 1
          fi
          if jar tf "$JAR" | grep -E 'ArmorStandGraveHologram|GraveHologramFactory'; then
            echo 'Legacy hologram fallback classes found in release jar.'
            exit 1
          fi

      - name: Build fixed slyph Cardboard 26.2
        shell: bash
        run: |
          set -euo pipefail
          CARDBOARD_SHA='5b62d59716f5a7d6dc0fa780ea7ca527e79272a5'
          git clone --filter=blob:none --no-checkout https://github.com/slyphmp4/Cardboard.git cardboard-src
          git -C cardboard-src fetch --depth 1 origin "$CARDBOARD_SHA"
          git -C cardboard-src checkout --detach FETCH_HEAD
          (
            cd cardboard-src
            ./gradlew clean build --no-daemon --stacktrace
          )
          CARDBOARD_JAR="$(find cardboard-src/build/libs -maxdepth 1 -name 'Cardboard-*.jar' | head -n 1)"
          test -n "$CARDBOARD_JAR"
          mkdir -p smoke/mods
          cp "$CARDBOARD_JAR" smoke/mods/Cardboard.jar

      - name: Smoke test on slyph Cardboard 26.2 with TextDisplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/mods smoke/plugins
          JAR="$(find build/libs -maxdepth 1 -name 'CloverGraves-*.jar' ! -name '*-unshaded.jar' | head -n 1)"
          cp "$JAR" smoke/plugins/CloverGraves.jar

          curl -fsSL -o fabric-installer.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar'
          curl -fsSL -o smoke/mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.156.0+26.2/fabric-api-0.156.0+26.2.jar'

          cd smoke
          java -jar ../fabric-installer.jar server -mcversion 26.2 -loader 0.19.3 -downloadMinecraft
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'PROPERTIES'
          online-mode=false
          enable-rcon=false
          enable-query=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=1
          motd=CloverGraves Cardboard TextDisplay CI
          PROPERTIES

          mkfifo server.in
          java -Dclovergraves.compatTest=true -Xms1G -Xmx2G -jar fabric-server-launch.jar nogui <server.in >server.log 2>&1 &
          SERVER_PID=$!
          exec 3>server.in

          PASS=0
          for i in $(seq 1 180); do
            if grep -q 'CLOVERGRAVES_CARDBOARD_26_2_SELFTEST_PASS' server.log 2>/dev/null; then
              PASS=1
              break
            fi
            if grep -q 'CLOVERGRAVES_CARDBOARD_26_2_SELFTEST_FAIL' server.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          printf 'stop\n' >&3 || true
          exec 3>&-
          wait "$SERVER_PID" || true
          cat server.log

          if [ "$PASS" -ne 1 ]; then
            echo 'Cardboard 26.2 TextDisplay self-test did not pass.'
            exit 1
          fi
          if grep -E 'Cannot spawn an entity for org\.bukkit\.entity\.TextDisplay|ClassCastException.*TextDisplay|AbstractMethodError|NoSuchMethodError|UnsupportedOperationException|Error occurred while enabling CloverGraves|Could not load .*CloverGraves|NoClassDefFoundError.*(CloverGraves|artillexstudios)' server.log; then
            echo 'CloverGraves TextDisplay runtime error detected.'
            exit 1
          fi

      - name: Upload CloverGraves jar
        uses: actions/upload-artifact@v7
        with:
          name: CloverGraves-${{ github.sha }}
          path: |
            build/libs/CloverGraves-*.jar
            !build/libs/*-unshaded.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite' && github.event.head_commit.message == 'Release CloverGraves 2.1.1'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified CloverGraves jar
        uses: actions/download-artifact@v8
        with:
          name: CloverGraves-${{ github.sha }}
          path: release

      - name: Publish CloverGraves 2.1.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v2.1.1'
          TARGET='release/CloverGraves-2.1.1.jar'
          JAR="$(find release -maxdepth 1 -name 'CloverGraves-*.jar' ! -name '*-unshaded.jar' | head -n 1)"
          test -n "$JAR"
          if [ "$JAR" != "$TARGET" ]; then
            mv "$JAR" "$TARGET"
          fi
          sha256sum "$TARGET" | sed 's#release/##' > release/SHA256SUMS.txt

          cat > release-notes.md <<'NOTES'
          CloverGraves 2.1.1 fixes persistence failures, inventory synchronization and teleport cancellation while preserving the Minecraft 26.2 / Java 25 target.

          ### Performance and reliability
          - Failed SQL deletions are retried; unreadable storage is no longer treated as an empty database.
          - JSON writes report failures, preserve corrupt files, and avoid duplicate records on retry.
          - Legacy JSON migration uses a verified transactional SQL batch and preserves its source on failure.
          - Fixed first-save/removal races and prevented older queued snapshots from overwriting newer saved state.
          - Synchronized grave inventories before instant pickup and removal; restored death drops when grave creation fails.
          - Failed grave reconstruction releases its history restore claim for another attempt.
          - Cancelled teleport warmups cannot complete a newer attempt; cancelled teleports refund Vault charges.
          - Grave targeting uses the chunk index, block centering avoids block access, and stale expiry entries are cleaned up.
          - Updated H2 from 2.4.240 to 2.5.250 and verified opening a test database written by the previous driver.
          - Fixed JDBC service descriptor merging and added an automated release-JAR check for all three drivers.

          ### Verification
          - 103 tests, including SQL/JSON failure and retry, transactional migration rollback, SQLite file storage and teleport warmup regression coverage.
          - Release publication runs only after Gradle tests, JAR audit, the pinned Cardboard 26.2 build and TextDisplay runtime smoke-test pass.
          - The smoke-test does not replace full multiplayer gameplay or live MySQL/Vault integration testing.

          ### Compatibility
          - Minecraft / Paper / Cardboard: 26.2
          - Bukkit api-version: 26.2
          - Java: 25
          - Paper API: 26.2 build 110 stable
          - Cardboard CI target: `slyphmp4/Cardboard` commit `5b62d59716f5a7d6dc0fa780ea7ca527e79272a5`

          ### Upgrade notes
          - Stop the server and back up the plugin data folder before replacing the JAR, especially when using H2.
          - Configuration formats, SQL schema, permissions and command aliases are preserved.
          - An unreadable storage backend now disables the plugin with a diagnostic instead of continuing with apparently empty data.
          - Download `CloverGraves-2.1.1.jar`; `SHA256SUMS.txt` contains its checksum.
          - See `MODERNIZATION_AUDIT.md` for the full audit and remaining limitations, including crash recovery during history restoration and mixed JSON/SQL fallback data.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARGET" release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title 'CloverGraves 2.1.1' --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$TARGET" release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title 'CloverGraves 2.1.1' \
              --notes-file release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
