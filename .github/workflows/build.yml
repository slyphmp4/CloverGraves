name: Build CloverGraves

on:
  push:
    branches: [rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Audit Cardboard compatibility
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'com\.artillexstudios\.axapi|org\.bukkit\.craftbukkit|net\.minecraft' src/main/java; then
            echo 'Forbidden AxAPI/NMS/CraftBukkit dependency found in main source.'
            exit 1
          fi
          if grep -RInE 'ArmorStandGraveHologram|GraveHologramFactory' src/main/java; then
            echo 'Legacy hologram fallback code is still present.'
            exit 1
          fi

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Audit built jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'CloverGraves-*.jar' ! -name '*-unshaded.jar' | head -n 1)"
          test -n "$JAR"
          if jar tf "$JAR" | grep -E 'com/artillexstudios/axapi|org/bukkit/craftbukkit|net/minecraft'; then
            echo 'Forbidden AxAPI/NMS/CraftBukkit classes found in release jar.'
            exit 1
          fi
          if jar tf "$JAR" | grep -E 'ArmorStandGraveHologram|GraveHologramFactory'; then
            echo 'Legacy hologram fallback classes found in release jar.'
            exit 1
          fi

      - name: Build fixed slyph Cardboard 26.3
        shell: bash
        run: |
          set -euo pipefail
          CARDBOARD_SHA='944000d2a13f1decccb55817484567f9d0dcc230'
          git clone --filter=blob:none --no-checkout https://github.com/slyphmp4/Cardboard.git cardboard-src
          git -C cardboard-src fetch --depth 1 origin "$CARDBOARD_SHA"
          git -C cardboard-src checkout --detach FETCH_HEAD
          (
            cd cardboard-src
            ./gradlew clean build --no-daemon --stacktrace
          )
          CARDBOARD_JAR="$(find cardboard-src/build/libs -maxdepth 1 -name 'Cardboard-*.jar' | head -n 1)"
          test -n "$CARDBOARD_JAR"
          mkdir -p smoke/mods
          cp "$CARDBOARD_JAR" smoke/mods/Cardboard.jar

      - name: Smoke test on slyph Cardboard 26.3 with TextDisplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/mods smoke/plugins
          JAR="$(find build/libs -maxdepth 1 -name 'CloverGraves-*.jar' ! -name '*-unshaded.jar' | head -n 1)"
          cp "$JAR" smoke/plugins/CloverGraves.jar

          curl -fsSL -o fabric-installer.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar'
          curl -fsSL -o smoke/mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.166.2+26.3/fabric-api-0.166.2+26.3.jar'

          cd smoke
          java -jar ../fabric-installer.jar server -mcversion 26.3 -loader 0.19.5 -downloadMinecraft
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'PROPERTIES'
          online-mode=false
          enable-rcon=false
          enable-query=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=1
          motd=CloverGraves Cardboard TextDisplay CI
          PROPERTIES

          mkfifo server.in
          java -Dclovergraves.compatTest=true -Xms1G -Xmx2G -jar fabric-server-launch.jar nogui <server.in >server.log 2>&1 &
          SERVER_PID=$!
          exec 3>server.in

          PASS=0
          for i in $(seq 1 180); do
            if grep -q 'CLOVERGRAVES_CARDBOARD_26_3_SELFTEST_PASS' server.log 2>/dev/null; then
              PASS=1
              break
            fi
            if grep -q 'CLOVERGRAVES_CARDBOARD_26_3_SELFTEST_FAIL' server.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          printf 'stop\n' >&3 || true
          exec 3>&-
          wait "$SERVER_PID" || true
          cat server.log

          if [ "$PASS" -ne 1 ]; then
            echo 'Cardboard 26.3 TextDisplay self-test did not pass.'
            exit 1
          fi
          if grep -E 'Cannot spawn an entity for org\.bukkit\.entity\.TextDisplay|ClassCastException.*TextDisplay|AbstractMethodError|NoSuchMethodError|UnsupportedOperationException|Error occurred while enabling CloverGraves|Could not load .*CloverGraves|NoClassDefFoundError.*(CloverGraves|artillexstudios)' server.log; then
            echo 'CloverGraves TextDisplay runtime error detected.'
            exit 1
          fi

      - name: Upload CloverGraves jar
        uses: actions/upload-artifact@v7
        with:
          name: CloverGraves-${{ github.sha }}
          path: |
            build/libs/CloverGraves-*.jar
            !build/libs/*-unshaded.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite' && github.event.head_commit.message == 'Release CloverGraves 2.2.0'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified CloverGraves jar
        uses: actions/download-artifact@v8
        with:
          name: CloverGraves-${{ github.sha }}
          path: release

      - name: Publish CloverGraves 2.2.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v2.2.0'
          TARGET='release/CloverGraves-2.2.0.jar'
          JAR="$(find release -maxdepth 1 -name 'CloverGraves-*.jar' ! -name '*-unshaded.jar' | head -n 1)"
          test -n "$JAR"
          if [ "$JAR" != "$TARGET" ]; then
            mv "$JAR" "$TARGET"
          fi
          sha256sum "$TARGET" | sed 's#release/##' > release/SHA256SUMS.txt

          cat > release-notes.md <<'NOTES'
          CloverGraves 2.2.0 ports the plugin to Minecraft/Paper/Cardboard 26.3 and improves persistence and GUI safety.

          ### Changes
          - Targets Paper API 26.3 build 257 stable, Java 25, Gradle 9.9.2 and JUnit 6.1.3.
          - Revalidates grave ownership and protection on inventory actions.
          - Stops silently switching from SQL storage to JSON if database initialization fails.
          - Adds explicit JSON storage mode and encrypted MySQL connections (TLS required).
          - Updates Cardboard 26.3 smoke tests for TextDisplay, native grave inventory and item serialization.

          ### Compatibility
          - Minecraft/Paper/Cardboard: 26.3
          - Bukkit api-version: 26.3
          - Java: 25

          ### Upgrade notes
          - Back up plugins/CloverGraves before replacing the plugin.
          - Existing database tables, command aliases and permission nodes are unchanged.
          - MySQL now requires TLS; configure the database server accordingly.
          - For verified MySQL server identity, configure ssl-mode: VERIFY_IDENTITY and trusted certificates.
          - Replace the old JAR while the server is stopped.
          - SHA256SUMS.txt provides the release JAR checksum.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARGET" release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title 'CloverGraves 2.2.0' --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$TARGET" release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title 'CloverGraves 2.2.0' \
              --notes-file release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
