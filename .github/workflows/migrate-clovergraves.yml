name: Migrate CloverGraves

on:
  push:
    branches: [rewrite]
    paths:
      - '.github/workflows/migrate-clovergraves.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rewrite
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Migrate project
        shell: bash
        run: |
          set -euo pipefail

          for root in src/main/java src/test/java; do
            old="$root/com/artillexstudios/axgraves"
            new="$root/com/slyph/clovergraves"
            if [ -d "$old" ]; then
              mkdir -p "$root/com/slyph"
              mv "$old" "$new"
              rmdir "$root/com/artillexstudios" 2>/dev/null || true
            fi
          done

          find src/main/java src/test/java -type f -name '*.java' -print0 | xargs -0 sed -i 's/com\.artillexstudios\.axgraves/com.slyph.clovergraves/g'

          cat > settings.gradle.kts <<'EOF'
          rootProject.name = "CloverGraves"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              java
              id("com.gradleup.shadow") version "9.6.1"
          }

          group = "com.slyph"
          version = "1.29.0"

          repositories {
              maven("https://repo.artillex-studios.com/releases/")
              maven("https://hub.spigotmc.org/nexus/content/repositories/snapshots/")
              maven("https://oss.sonatype.org/content/groups/public/")
              maven("https://jitpack.io")
              mavenCentral()
          }

          dependencies {
              compileOnly("org.spigotmc:spigot-api:1.20.2-R0.1-SNAPSHOT")
              implementation("com.artillexstudios.axapi:axapi:2.1.0-DEV-32:all")
              compileOnly("org.slf4j:slf4j-api:2.0.17")
              compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
                  isTransitive = false
              }
              implementation("org.bstats:bstats-bukkit:3.2.1")

              testImplementation(platform("org.junit:junit-bom:5.11.4"))
              testImplementation("org.junit.jupiter:junit-jupiter")
              testImplementation("com.h2database:h2:2.3.232")
              testImplementation("it.unimi.dsi:fastutil:8.5.13")
          }

          java {
              toolchain.languageVersion.set(JavaLanguageVersion.of(21))
          }

          tasks.withType<JavaCompile>().configureEach {
              options.encoding = "UTF-8"
              options.compilerArgs.add("-parameters")
          }

          tasks.processResources {
              filesMatching("plugin.yml") {
                  expand("version" to project.version)
              }
          }

          tasks.test {
              useJUnitPlatform()
          }

          tasks.jar {
              archiveBaseName.set("CloverGraves")
              archiveClassifier.set("unshaded")
          }

          tasks.shadowJar {
              archiveBaseName.set("CloverGraves")
              archiveClassifier.set("")
              relocate("com.artillexstudios.axapi", "com.slyph.clovergraves.libs.axapi")
              relocate("org.bstats", "com.slyph.clovergraves.libs.bstats")
              relocate("revxrsal.commands", "com.slyph.clovergraves.libs.lamp")
          }

          tasks.build {
              dependsOn(tasks.shadowJar)
          }
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: CloverGraves
          version: '${version}'
          main: com.slyph.clovergraves.AxGraves
          api-version: '1.16'
          authors: [slyph]
          folia-supported: true
          softdepend: [Vault]

          permissions:
            axgraves.help:
              default: true
            axgraves.reload:
              default: op
            axgraves.list:
              default: true
            axgraves.list.other:
              default: op
            axgraves.tp:
              default: true
            axgraves.tp.bypass:
              default: op
            axgraves.allowgraves:
              default: true
            axgraves.limit.1:
              default: false
            axgraves.admin:
              default: op
            axgraves.update-notify:
              default: op
            axgraves.protection.bypass:
              default: op
            axgraves.history:
              default: op
            axgraves.restore:
              default: op
          EOF

          rm -f pom.xml
          gradle wrapper --gradle-version 9.7.1 --distribution-type bin
          rm -rf .gradle

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f gradle/wrapper/gradle-wrapper.jar
          git commit -m "Migrate CloverGraves to Gradle and com.slyph.clovergraves"
          git push origin HEAD:rewrite
